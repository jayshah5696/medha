name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  # Build the PyInstaller sidecar binary (macOS only for now)
  build-sidecar:
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: cd backend && uv sync --all-groups

      - name: Build sidecar
        run: cd backend && uv run pyinstaller medha.spec

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.arch }}
          path: backend/dist/medha-backend/

  # Build the Electron desktop app
  build-desktop:
    needs: build-sidecar
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.arch }}
          path: backend/dist/medha-backend/

      - name: Make sidecar executable
        run: chmod +x backend/dist/medha-backend/medha-backend

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Install Electron deps
        run: npm ci

      - name: Compile Electron TypeScript
        run: npx tsc -p electron/tsconfig.json

      - name: Build DMG
        env:
          # When no signing cert is configured, disable auto-discovery
          # to prevent electron-builder from failing on empty CSC_LINK
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Rename DMG to standard name
        run: |
          cd release
          VERSION="${GITHUB_REF_NAME#v}"
          # Force a single, predictable filename per arch
          DMG=$(ls *.dmg | head -1)
          mv "$DMG" "Medha-${VERSION}-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: release/*.dmg

  # Run tests before publishing
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Backend tests
        run: cd backend && uv sync && uv run pytest tests/ -v --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frontend tests
        run: cd frontend && npm ci && NODE_ENV=development npx vitest run

  # Create GitHub Release with DMG artifacts
  publish:
    needs: [build-desktop, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: artifacts/

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Auto-update Homebrew tap
  update-homebrew:
    needs: publish
    runs-on: macos-latest
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: artifacts/

      - name: Compute SHA256
        id: sha
        run: |
          cd artifacts
          ls -la *.dmg
          ARM_SHA=$(shasum -a 256 *arm64.dmg | awk '{print $1}')
          X64_SHA=$(shasum -a 256 *x64.dmg | awk '{print $1}')
          echo "arm64=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "x64=$X64_SHA" >> "$GITHUB_OUTPUT"
          echo "Computed: arm64=$ARM_SHA x64=$X64_SHA"

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: jayshah5696/homebrew-medha
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask formula
        run: |
          cd tap
          sed -i '' 's/version ".*"/version "${{ steps.version.outputs.version }}"/' Casks/medha.rb
          sed -i '' 's/arm:   ".*"/arm:   "${{ steps.sha.outputs.arm64 }}"/' Casks/medha.rb
          sed -i '' 's/intel: ".*"/intel: "${{ steps.sha.outputs.x64 }}"/' Casks/medha.rb

      - name: Commit and push
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/medha.rb
          git diff --cached --quiet || git commit -m "Update Medha to ${{ steps.version.outputs.version }}"
          git push
